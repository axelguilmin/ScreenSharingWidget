name: ScreenSharingWidgets
options:
  bundleIdPrefix: fr.axelguilmin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
settings:
  base:
    DEVELOPMENT_TEAM: JMQMP88PPC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ScreenSharingWidgets:
    type: application
    platform: macOS
    sources:
      - path: ScreenSharingWidgets
        excludes: [AppIcon.icon]
      - Shared
      - path: ScreenSharingWidgets/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: ScreenSharingWidgetsExtension
        embed: true
      - package: Sparkle
    entitlements:
      path: ScreenSharingWidgets/ScreenSharingWidgets.entitlements
      properties:
        com.apple.security.application-groups: [JMQMP88PPC.fr.axelguilmin.ScreenSharingWidgets]
    info:
      path: ScreenSharingWidgets/Info.plist
      properties:
        CFBundleDisplayName: Screen Sharing Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Axel Guilmin
        NSLocalNetworkUsageDescription: Shows the Macs on your local network that share their screen.
        NSBonjourServices: [_rfb._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: fr.axelguilmin.ScreenSharingWidgets
            CFBundleURLSchemes: [screensharingwidgets]
        SUFeedURL: https://github.com/axelguilmin/ScreenSharingWidget/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: QnXND5m3hmg0HUOkc3lsbDOYxTRHSO8Zy4Y2c4e2UoI=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.axelguilmin.ScreenSharingWidgets
        PRODUCT_NAME: Screen Sharing Widgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HOST_APP
  ScreenSharingWidgetsExtension:
    type: app-extension
    platform: macOS
    sources: [ScreenSharingWidgetsExtension, Shared]
    entitlements:
      path: ScreenSharingWidgetsExtension/ScreenSharingWidgetsExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [JMQMP88PPC.fr.axelguilmin.ScreenSharingWidgets]
    info:
      path: ScreenSharingWidgetsExtension/Info.plist
      properties:
        CFBundleDisplayName: Screen Sharing Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.axelguilmin.ScreenSharingWidgets.Extension
        PRODUCT_NAME: ScreenSharingWidgetsExtension
        ENABLE_APP_SANDBOX: YES
